<svg xmlns="http://www.w3.org/2000/svg" viewBox="78 38 350 406" role="img" aria-labelledby="title desc">
  <title id="title">Weekaboo</title><desc id="desc">A little sage calendar covers its eyes, peeks, then opens its hands with a smile.</desc>
  <defs>
    <linearGradient id="sage" x2=".9" y2="1"><stop stop-color="#a1af91"/><stop offset="1" stop-color="#859677"/></linearGradient>
    <linearGradient id="paper" x2=".6" y2="1"><stop stop-color="#fffbed"/><stop offset="1" stop-color="#faf1de"/></linearGradient>
    <linearGradient id="paw" x2="1" y2=".7"><stop stop-color="#a3b396"/><stop offset="1" stop-color="#8c9e7f"/></linearGradient>
  </defs>
  <style>
@font-face{font-family:Nunito;src:url(../fonts/Nunito-Variable.ttf)}
    .body {transform-origin:240px 408px;animation:bob 3.6s both;}
    .left {transform-origin:155px 282px;animation:left-peek 3.6s both;}
    .right {transform-origin:325px 282px;animation:right-peek 3.6s both;}
    .eyes {transform-origin:240px 233px;animation:blink 3.6s both;}
    .spark {transform-origin:375px 212px;animation:spark 3.6s both;}
    .shadow {transform-origin:240px 421px;animation:shadow 3.6s both;}
    @keyframes bob {0%,18%{transform:translateY(3px) scale(.98,1.01)}35%{transform:rotate(-2deg)}60%{transform:rotate(2deg) translateY(-7px)}78%{transform:translateY(2px) scale(1.02,.98)}100%{transform:none}}
    @keyframes left-peek {0%,26%{transform:translate(22px,-22px) rotate(16deg)}43%,56%{transform:translate(18px,-20px) rotate(12deg)}72%{transform:translate(-15px,31px) rotate(-27deg)}84%{transform:translate(-10px,24px) rotate(-19deg)}100%{transform:translate(-12px,26px) rotate(-22deg)}}
    @keyframes right-peek {0%,22%{transform:translate(-28px,-22px) rotate(-18deg)}38%,54%{transform:translate(3px,-3px) rotate(6deg)}72%{transform:translate(15px,31px) rotate(27deg)}84%{transform:translate(10px,24px) rotate(19deg)}100%{transform:translate(12px,26px) rotate(22deg)}}
    @keyframes blink {0%,77%,85%,100%{transform:scaleY(1)}81%{transform:scaleY(.08)}}
    @keyframes spark {0%,31%{opacity:0;transform:scale(.4)}41%,57%{opacity:1;transform:scale(1)}69%,100%{opacity:0;transform:scale(1.2)}}
    @keyframes shadow {0%,100%{transform:scaleX(1)}60%{transform:scaleX(.9)}}
    @media(prefers-reduced-motion:reduce){.body,.left,.right,.eyes,.spark,.shadow{animation:none}.left{transform:translate(-12px,26px) rotate(-22deg)}.right{transform:translate(12px,26px) rotate(22deg)}.spark{opacity:0}}
  </style>
  <ellipse class="shadow" cx="240" cy="421" rx="117" ry="12" fill="#eed9b5" opacity=".55"/>
  <g class="body">
    <g fill="url(#sage)" stroke="#788969" stroke-width="5"><path d="M173 380v32q0 15 25 15t27-15l4-32z"/><path d="m256 380 5 32q1 15 27 15t26-15v-32z"/></g>
    <path d="M108 136q-9-33 33-38l189-5q43-1 45 44l1 221q0 40-43 43l-179 3q-46 0-47-46z" fill="#dbcbaa"/>
    <path d="M116 139q0-37 39-38l176-5q42-1 43 42l2 213q0 43-42 45l-177 3q-41 0-41-46z" fill="url(#paper)" stroke="#ecddbe" stroke-width="4"/>
    <path d="M110 159v-21q0-40 44-42l179-4q43-1 42 47v14z" fill="url(#sage)"/>
    <g fill="#506144"><ellipse cx="180" cy="119" rx="16" ry="18"/><ellipse cx="310" cy="115" rx="16" ry="18"/></g>
    <g fill="none" stroke-linecap="round"><path d="M163 99V78q0-22 15-22t16 27v33" stroke="#77876b" stroke-width="20"/><path d="M180 58q16 0 16 27v31" stroke="url(#sage)" stroke-width="21"/><path d="M293 95V74q0-22 15-22t16 27v33" stroke="#77876b" stroke-width="20"/><path d="M310 54q16 0 16 27v31" stroke="url(#sage)" stroke-width="21"/></g>
    <g fill="#ffc3a0" opacity=".8"><ellipse cx="178" cy="268" rx="19" ry="12"/><ellipse cx="305" cy="268" rx="19" ry="12"/></g>
    <g class="eyes" fill="#46553d"><ellipse cx="184" cy="232" rx="13" ry="19"/><ellipse cx="299" cy="229" rx="13" ry="19"/><g fill="#fffdf2"><ellipse cx="189" cy="223" rx="4" ry="5"/><ellipse cx="304" cy="220" rx="4" ry="5"/></g></g>
    <g fill="none" stroke="#46553d" stroke-width="6" stroke-linecap="round"><path d="M175 196q9-8 18-1M291 191q10-9 20 2"/><path d="M229 251q3 24 20 18 9-4 10-18"/></g>
    <g fill="#d6d9bd">
      <rect x="177" y="301" width="22" height="20" rx="5"/><rect x="211" y="299" width="22" height="20" rx="5"/><rect x="245" y="297" width="22" height="20" rx="5"/><rect x="279" y="295" width="22" height="20" rx="5"/><rect x="313" y="293" width="22" height="20" rx="5"/>
      <rect x="177" y="329" width="22" height="20" rx="5"/><rect x="211" y="327" width="22" height="20" rx="5"/><rect x="245" y="325" width="22" height="20" rx="5"/><rect x="279" y="323" width="22" height="20" rx="5"/>
      <rect x="177" y="357" width="22" height="20" rx="5"/><rect x="211" y="355" width="22" height="20" rx="5"/><rect x="245" y="353" width="22" height="20" rx="5"/>
    </g><rect x="313" y="321" width="22" height="20" rx="5" fill="#f6ae8c"/>
    <g fill="url(#paw)" stroke="#798d6e" stroke-width="5" stroke-linejoin="round">
      <g class="left"><path d="M111 292q-19-16-4-41 14-22 48-35 1-20 17-33 16-13 24-3 5 7-3 18 26-17 39-2 14 18-4 39-12 15-33 22-5 21-23 34-35 22-61 1z"/></g>
      <g class="right"><path d="M365 290q20-17 4-43-11-27-28-46-15-17-27-12-9 5-3 13-21-8-28 5-8 14 13 26-20-5-20 9 0 13 25 22 1 21 20 40 18 6 44-14z"/></g>
    </g>
    <g class="spark" fill="none" stroke="#f6ae8c" stroke-width="9" stroke-linecap="round"><path d="m376 200 12-23m-5 38 20-14m-13 31 21 1"/></g>
  </g>

</svg>
