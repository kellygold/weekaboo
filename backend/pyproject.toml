[project]
name = "weekaboo-calendar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "sqlalchemy>=2,<3",
  "pydantic-settings>=2.6,<3", "cryptography>=43", "python-dateutil>=2.9,<3",
  "httpx>=0.27,<1", "icalendar>=6,<7"
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
